name: Publish OCI & Official MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_registry:
        description: "Publish server manifests to official registry.modelcontextprotocol.io via GitHub OIDC"
        required: false
        type: boolean
        default: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      IMAGE_NAME: ghcr.io/pecopeko/mcp-public-intel
      JPX_NAME: io.github.pecopeko/jpx-tokyo-stock-tdnet-edinet-japan-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & smoke-test MCP server
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & verify MCP tool schemas
        run: |
          python -m pip install --upgrade pip
          pip install .
          mcp-public-intel --version
          mcp-public-intel --list-tools

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push JPX-indexed OCI image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MCP_SERVER_NAME=${{ env.JPX_NAME }}
          tags: |
            ${{ env.IMAGE_NAME }}:1.1.0-jpx
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            io.modelcontextprotocol.server.name=${{ env.JPX_NAME }}
            org.opencontainers.image.source=https://github.com/pecopeko/mcp-public-intel
          annotations: |
            index,manifest:io.modelcontextprotocol.server.name=${{ env.JPX_NAME }}
            index,manifest:org.opencontainers.image.source=https://github.com/pecopeko/mcp-public-intel

      - name: Download official mcp-publisher CLI
        if: ${{ github.event_name == 'push' || inputs.publish_registry == true }}
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          curl --fail --location --silent --show-error "${url}" -o "${archive}"
          tar -xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate via GitHub OIDC & publish JPX manifest to Official MCP Registry
        if: ${{ github.event_name == 'push' || inputs.publish_registry == true }}
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server-jpx.json
